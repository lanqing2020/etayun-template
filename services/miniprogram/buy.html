          content="{companyname}提供微信小程序、微信小程序开发、微信小程序制作、微信小程序商店，拖拽可视化搭建，无需代码，各类小程序自由组合，拥有海量小程序行业模板，帮助中小企业一键生成微信小程序">

          content="小程序,微信小程序,微信小程序开发,微信小程序制作,微信小程序商店,微信小程序怎么用,微信小程序有哪些">

    <script>
        var paytypeprice = {paytypeprice};
        var usemoney = {usemoney};
        var proid = "{proid}";
        var year = "{year}";

        function getprice() {
            var year = $("select[name='years']").val()
            var proid = $("select[name='proid']").val()
            if (year == "7") {
                $("#showbuymoney").html("&yen; " + paytypeprice + "(试用)");
                return false
            }
            $.post("buy.asp", {act: "price", proid: proid}, function (req) {
                $("#showbuymoney").html("&yen; " + req.price * year);

            }, "json")

        }


        $(function () {
            $("select[name='proid']").val(proid)
            $("select[name='years']").val(year)
            getprice()
            var objyear = $("select[name='years']")

            $("select[name='years'],select[name='proid']").on("change", function () {
                getprice()
            })


            $(".J-submit-btn").on("click", function () {
                var self = $(this);
                self.prop("disabled", true);
                var year = $("select[name='years']").val()
                var proid = $("select[name='proid']").val()
                $.post("buy.asp", {act: "add", proid: proid, year: year}, function (req) {
                    if (req.result == "200") {
                        location.href = "/bagshow/"
                    } else {
                        alert(req.msg)
                    }

                }, "json")


            })
        })


    </script>
</head>
<body class="min990">
{#top.html}

<div class="container" style="margin-top:45px;">
    <form id="J_miniprogramOrderForm" method="post" action="buy.asp" onsubmit="return false">

                <ul class="order-list cl">

                    <li>
                        <div class="ol-name">开通产品名：</div>
                        <div class="ol-content">

                                <option value="minibase">标准版</option>
                                <option value="minipro">全能版</option>
                            </select>
                        </div>
                    </li>
                    <li>
                        <div class="ol-name">购买年限：</div>
                        <div class="ol-content">
                            <select class="ol-select" name="years">
                                <option value="1">1年</option>
                                <option value="2">2年(买2年送1年)</option>
                                <option value="3">3年(买3年送2年)</option>
                                <option value="7">试用</option>
                            </select>
                        </div>
                    </li>

                    <li>
                        <div class="ol-name">费用合计：</div>
                        <div class="ol-content">
                            <span class="ol-price" id="showbuymoney">-</span>
                        </div>
                    </li>
                    <li>
                        <div class="ol-name">&nbsp;</div>
                        <div class="ol-content">
                            <a class="J-submit-btn order-btn">去购物车结算</a>
                        </div>
                    </li>
                </ul>
